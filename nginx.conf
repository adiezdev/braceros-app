server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se sirve. El bundle de xlsx pasa de 429 kB a 143 kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los ficheros de assets/ llevan un hash en el nombre: si cambia el
    # contenido, cambia el nombre. Así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index NO se cachea. Es quien apunta a los assets nuevos: si el
    # navegador se quedara con el viejo, no verías los cambios tras desplegar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Todo lo que empiece por /api va al contenedor de la API. "api" es el
    # nombre del servicio en el compose; lo resuelve la red de Docker.
    # Así el navegador ve un solo origen y no hay CORS que valga.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # "Cargar otro Excel" manda la lista entera de una vez.
        client_max_body_size 8m;
        proxy_read_timeout   60s;
    }

    # Para que el contenedor pueda decir "estoy vivo" sin cargar la app entera.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
