name: Publicar imágenes

# Se dispara con cada push a main o a prueba-openship, y también a mano desde
# la pestaña Actions de GitHub (botón "Run workflow"), por si quieres
# reconstruir sin tocar código. En la rama de prueba se publica el tag
# ":prueba-openship" para el stack de validación; en main, ":latest" para prod.
on:
  push:
    branches: [main, prueba-openship]
  workflow_dispatch:

jobs:
  imagenes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # necesario para subir a ghcr.io

    # Las dos imágenes se construyen a la vez y por separado. Si falla una,
    # la otra no se publica: el compose del NAS quedaría descuadrado.
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: app # nginx con la interfaz
            contexto: .
            dockerfile: ./Dockerfile
            sufijo: ""
          - nombre: api # Node contra Postgres
            contexto: ./api
            dockerfile: ./api/Dockerfile
            sufijo: "-api"

    name: ${{ matrix.nombre }}

    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige minúsculas y el usuario puede llevar mayúsculas.
      - name: Nombre de la imagen
        id: img
        run: echo "nombre=${GITHUB_REPOSITORY,,}${{ matrix.sufijo }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token que GitHub genera solo para esta ejecución. No hay que
          # crear ningún secreto para esta parte.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.nombre }}
          # :latest solo desde main (lo que sigue prod, el stack de prueba usa
          # ":prueba-openship"). La del hash del commit queda de histórico.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha,format=short

      - name: Construir y subir
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          # El DXP4800 es Intel, así que basta con amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché entre ejecuciones, separada por imagen para que no se pisen.
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
