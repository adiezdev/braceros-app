# ---------------------------------------------------------------------------
# Versión para OpenShip (rama de prueba) — deploy/docker-compose.yml.
#
# A diferencia del compose de producción (que tiraba de imágenes de GHCR y
# usaba watchtower), este construye desde el código con `build:` y prescinde
# de watchtower: OpenShip hace el autodeploy en cada push y gestiona el
# rollout y el TLS mediante su edge.
#
# Se trata de una réplica de PRUEBA: Postgres usa un volumen aparte
# (datos_openship) para no tocar la base real de producción durante la
# validación. Cuando se valide, se apuntará al volumen real.
#
# OpenShip lee este fichero como un stack multi-servicio: cada servicio es un
# contenedor con su image/build, ports, depends_on, environment, volumes y
# healthcheck.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: braceros
      POSTGRES_USER: braceros
      POSTGRES_PASSWORD: ${DB_PASSWORD:-desarrollo}
      TZ: Europe/Madrid

    volumes:
      # Volumen DE PRUEBA: separado del "datos" real de producción.
      - datos_openship:/var/lib/postgresql/data

    # Sin "ports": OpenShip lo enruta por dominio; la base no debe exponerse
    # a la red pública.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braceros -d braceros"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    # Contexto relativo a la carpeta de ESTE fichero (deploy/), de ahí el "..".
    # Es lo que necesita OpenShip: los build: se resuelven contra la carpeta
    # del compose, no contra la raíz del repo.
    build: ../api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgres://braceros:${DB_PASSWORD:-desarrollo}@postgres:5432/braceros
      # Firma de sesiones. Piérdela y nadie entra (ni sale) hasta regenerarla.
      JWT_SECRET: ${JWT_SECRET:-e6df35bf5add87044162e85ec763801f1d0f6dc6f140031ba4b859702fa0d609}
      # Volcado por foto (IA). Vacío si no se ha configurado: la app avisa.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.5-flash-lite}
      TZ: Europe/Madrid

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  braceros:
    # Contexto relativo a la carpeta de ESTE fichero (deploy/): ".." es la raíz
    # del repo, donde está el Dockerfile del frontend (nginx).
    build: ..
    restart: unless-stopped

    depends_on:
      - api

    # Puerto web del contenedor. OpenShip lo enruta a su dominio y termina TLS.
    ports:
      - "${PUERTO:-8087}:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  datos_openship:
