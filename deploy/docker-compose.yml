# Esto va en el NAS, no se ejecuta en tu portátil.
# Copia este fichero y el .env al NAS, y desde esa carpeta:
#   docker compose up -d
#
# Cuatro contenedores:
#   postgres    la base de datos. Los datos viven en un volumen del NAS.
#   api         Node: lee y escribe en postgres, habla JSON con el navegador
#   braceros    nginx: sirve la app y pasa /api a la api
#   watchtower  vigila si hay imagen nueva en GitHub y la despliega

services:
  postgres:
    image: postgres:17-alpine
    container_name: braceros-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: braceros
      POSTGRES_USER: braceros
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
      # Sin esto, un reinicio con la hora cambiada descoloca los timestamps.
      TZ: Europe/Madrid

    volumes:
      # Volumen con nombre: sobrevive a que borres y recrees los contenedores.
      # Es EL sitio donde están los datos. Lo que haya que respaldar es esto.
      - datos:/var/lib/postgresql/data

    # Deliberadamente SIN "ports": la base no se asoma a la red del NAS.
    # Solo la alcanzan los contenedores de esta misma red.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braceros -d braceros"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ghcr.io/${GHCR_USER}/${GHCR_REPO}-api:latest
    container_name: braceros-api
    restart: unless-stopped

    depends_on:
      postgres:
        # Espera a que la base acepte conexiones, no solo a que arranque.
        condition: service_healthy

    environment:
      DATABASE_URL: postgres://braceros:${DB_PASSWORD}@postgres:5432/braceros
      TZ: Europe/Madrid

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  braceros:
    image: ghcr.io/${GHCR_USER}/${GHCR_REPO}:latest
    container_name: braceros
    restart: unless-stopped

    depends_on:
      - api

    ports:
      # izquierda = puerto del NAS, derecha = puerto dentro del contenedor.
      # El 80 y el 443 del NAS los usa UGOS para su propia interfaz.
      - "${PUERTO:-8087}:80"

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  watchtower:
    image: containrrr/watchtower:latest
    container_name: braceros-watchtower
    restart: unless-stopped

    volumes:
      # Le da acceso al Docker del NAS: así puede parar y arrancar los
      # contenedores cuando llega una versión nueva.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Credenciales para leer del registro privado de GitHub.
      REPO_USER: ${GHCR_USER}
      REPO_PASS: ${GHCR_TOKEN:?falta GHCR_TOKEN en el .env}
      WATCHTOWER_POLL_INTERVAL: ${INTERVALO:-300}
      # Solo toca los contenedores con la etiqueta de arriba. Postgres NO la
      # tiene a propósito: la base no se actualiza sola, eso se hace a mano
      # y leyendo antes las notas de la versión.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Madrid

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  datos:
