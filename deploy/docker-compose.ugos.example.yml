# VersiÃ³n sin .env, para pegar tal cual en el gestor de Docker del NAS.
#
# El otro fichero (docker-compose.yml) lee la configuraciÃ³n de un .env, que es
# lo limpio pero necesita consola. Este la lleva escrita dentro, para cuando el
# gestor web no deja crear ficheros que empiezan por punto.
#
# HAY QUE RELLENAR CUATRO COSAS. EstÃ¡n marcadas con <<< >>>. Busca "<<<".
#
# Ojo: al llevar dentro la contraseÃ±a de la base y el token de GitHub, este
# fichero no se sube a GitHub ni se deja en una carpeta compartida.

services:
  postgres:
    image: postgres:17-alpine
    container_name: braceros-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: braceros
      POSTGRES_USER: braceros
      # <<< 1. INVÃ‰NTATE UNA CONTRASEÃ‘A LARGA Y PÃ‰GALA EN LOS DOS SITIOS >>>
      # (aquÃ­ y en DATABASE_URL de abajo; tienen que ser idÃ©ntica)
      # Solo se usa la primera vez, cuando se crea el volumen.
      POSTGRES_PASSWORD: CAMBIAME
      TZ: Europe/Madrid

    volumes:
      # AquÃ­ viven los datos. Sobrevive a borrar y recrear los contenedores.
      - datos:/var/lib/postgresql/data

    # Deliberadamente SIN "ports": la base no se asoma a la red del NAS.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braceros -d braceros"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    # <<< 2. TU USUARIO Y TU REPOSITORIO, EN MINÃšSCULAS. FÃ­jate en el -api >>>
    image: ghcr.io/tuusuario/braceros-app-api:latest
    container_name: braceros-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # <<< la MISMA contraseña que arriba, entre los dos puntos y la arroba >>>
      DATABASE_URL: postgres://braceros:CAMBIAME@postgres:5432/braceros
      # <<< 5. (OPCIONAL) Clave de Google Gemini para "Leer de la foto".
      #    Déjala vacía si no la vas a usar; el resto de la app sigue igual.
      #    Se saca gratis en aistudio.google.com > Get API key.
      #    Aviso: sube las fotos a Google. >>>
      GEMINI_API_KEY:
      GEMINI_MODELO: gemini-3.5-flash-lite
      TZ: Europe/Madrid

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  braceros:
    # <<< 3. lo mismo que arriba, pero SIN el -api >>>
    image: ghcr.io/tuusuario/braceros-app:latest
    container_name: braceros
    restart: unless-stopped

    depends_on:
      - api

    ports:
      # izquierda = puerto del NAS, derecha = dentro del contenedor.
      # El 80 y el 443 los usa UGOS para su propia interfaz.
      - "8087:80"

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  watchtower:
    image: containrrr/watchtower:latest
    container_name: braceros-watchtower
    restart: unless-stopped

    volumes:
      # Le da acceso al Docker del NAS para poder reiniciar los contenedores.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # <<< 4. TU USUARIO DE GITHUB Y EL TOKEN CON read:packages >>>
      # Es el mismo token del "docker login" del paso 1.
      REPO_USER: tuusuario
      REPO_PASS: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx

      # Sin esta fija, el socket de Docker del NAS le da a watchtower una
      # version demasiado antigua de la API y falla. Con una version fija
      # negocia bien.
      DOCKER_API_VERSION: "1.41"

      WATCHTOWER_POLL_INTERVAL: 300
      # Solo toca los contenedores con la etiqueta de arriba. Postgres NO la
      # tiene a propÃ³sito: una base de datos no se actualiza sola de noche.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Madrid

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  datos:
